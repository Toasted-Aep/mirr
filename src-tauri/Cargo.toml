[package]
name = "mirr"
version = "1.0.0"
description = "Mirr — Windows 11 Apple wireless bridge (AirPlay / AirPlay 2 / AirCast / LocalSend)"
authors = ["Toasted-Aep"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# async runtime + http
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }

# discovery
mdns-sd = "0.11"
socket2 = { version = "0.5", features = ["all"] }
local-ip-address = "0.6"

# AirPlay 2 embedded receiver & audio
openairplay2 = "0.5.0"
cpal = "0.18"
base64 = "0.22"
plist = "1"

# data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rand = "0.8"
once_cell = "1"
anyhow = "1"
rust_cast = { version = "0.21.0", features = ["thread_safe"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# native window embedding — docks the mirror video into the main UI
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_UI_Shell_PropertiesSystem",
] }

[features]
# default to the production build; engines are spawned as sidecars at runtime
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3

[[bin]]
name = "mirr"
path = "src/main.rs"
